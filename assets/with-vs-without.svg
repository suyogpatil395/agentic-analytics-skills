e applied</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9500000000000002s" dur=".4s" fill="freeze"/><rect x="640" y="336" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="660" y="365" fill="#34d399" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >4</text><text x="690" y="358" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Store-local business date</text><text x="690" y="375" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >matches the POS day close</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur=".4s" fill="freeze"/><rect x="640" y="394" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="660" y="423" fill="#34d399" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >5</text><text x="690" y="416" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Formatted table + total + self-check</text><text x="690" y="433" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >sums reconcile · ready to share</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur=".5s" fill="freeze"/><rect x="640" y="470" width="500" height="36" rx="10" fill="#34d399" stroke="#34d399" stroke-width="1" fill-opacity=".14"/><text x="890" y="494" fill="#34d399" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle" >Correct
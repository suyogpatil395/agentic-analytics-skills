goe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >2</text><text x="110" y="242" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Picks &#x27;total_sales&#x27; (gross) for &#x27;net sales&#x27;</text><text x="110" y="259" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >wrong measure → inflated number</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur=".4s" fill="freeze"/><rect x="60" y="278" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="80" y="307" fill="#f87171" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >3</text><text x="110" y="300" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Forgets status = completed</text><text x="110" y="317" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >cancelled bills counted</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6500000000000001s" dur=".4s" fill="freeze"/><rect x="60" y="336" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="80" y="365" fill="#f87171" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >4</text><text x="110" y="358" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Filters by UTC timestamp</text><text x="110" y="375" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >late-night orders on wrong day</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur=".4s" fill="freeze"/><rect x="60" y="394" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="80" y="423" fill="#f87171" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" >5</text><text x="110" y="416" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" text-anchor="start" >Dumps raw JSON rows</text><text x="110" y="433" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >no table, no totals, no check</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.3s" dur=".5s" fill="freeze"/><rect x="60" y="470" width="500" height="36" rx="10" fill="#f87171" stroke="#f87171" stroke-width="1" fill-opacity=".14"/><text x="310" y="494" fill="#f87171" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle" >Fast to ask · wrong to trust</text></g><rect x="620" y="100" width="540" height="420" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.8" /><text x="644" y="134" fill="#34d399" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="start" letter-spacing="1">✓  WITH THE ANALYTICS SKILL</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.6s" dur=".4s" fill="freeze"/><rect x="640" y="162" width="500" height="48" rx="10" fill="#111c33" stroke="#1e293b" stroke-width="1" /><text x="660" y="191" fill="#34d399" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" t
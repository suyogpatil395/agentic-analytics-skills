<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e293b"/></pattern></defs><rect width="1200" height="600" rx="20" fill="#070b16"/><rect width="1200" height="600" rx="20" fill="url(#dots)"/><text x="40" y="52" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start" >Anatomy of an analytics skill</text><text x="40" y="78" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="400" text-anchor="start" >loaded in layers: the agent reads only what the question needs (progressive disclosure)</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.0s" dur=".5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" begin="0.0s" dur=".5s" fill="freeze"/><rect x="40" y="104" width="1120" height="54" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.6" /><rect x="40" y="104" width="6" height="54" rx="3" fill="#22d3ee"/><text x="64" y="137" fill="#22d3ee" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="15" font-weight="800" text-anchor="start" >FRONTMATTER</text><text x="340" y="129" fill="#e2e8f0" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" >name + description = when to trigger</text><text x="340" y="147" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5" font-weight="400" text-anchor="start" >always in context · ~100 tokens</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.25s" dur=".5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-20 0" to="0 0" begin="0.25s" dur=".5s" fill="freeze"/><r